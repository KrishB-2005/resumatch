name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The llm extra pulls both SDKs. They are needed because the wire-format
      # tests drive the real openai and anthropic clients against a loopback
      # server: no key, no network, but the request is built by the same code
      # that would talk to the live endpoint.
      - name: Install
        run: pip install -e ".[dev,llm]"

      - name: Lint
        run: ruff check .

      # No API key is set here on purpose. The matcher is not allowed to need a
      # model, and a green build with no credentials in the environment is what
      # holds it to that.
      - name: Test
        run: pytest -q

      - name: Benchmarks
        run: resumatch benchmark
