[project]
name = "resumatch"
version = "0.1.0"
description = "Scores a resume against a job description with a traceable, testable match — not a vibe from a language model."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krish Bhatt" }]
license = { text = "MIT" }

dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pypdf>=4.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
resumatch = "resumatch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resumatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
